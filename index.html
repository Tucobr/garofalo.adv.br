<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GAROFALO ADVOCACIA — Rafael Baida Garofalo">
<title>GAROFALO ADVOCACIA</title>
<style>
  :root{
    --paper:#f3f1ec;
    --ink:#171717;
    --muted:#66635e;
    --line:#d7d3cb;
    --accent:#8b8274;
    --max:1180px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      linear-gradient(90deg,rgba(243,241,236,.96),rgba(243,241,236,.82)),
      #d8d4cc;
    color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    line-height:1.6;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.17;
    background:
      linear-gradient(90deg,
        transparent 0 10%,#57534d 10.1% 10.18%,
        transparent 10.28% 28%,#57534d 28.1% 28.18%,
        transparent 28.28% 51%,#57534d 51.1% 51.18%,
        transparent 51.28% 76%,#57534d 76.1% 76.18%,
        transparent 76.28%);
    transform:perspective(1100px) rotateY(-8deg) rotateZ(-1.5deg) scale(1.12);
  }
  body::after{
    content:"";
    position:fixed;
    width:38vw;
    height:62vh;
    right:4vw;
    top:13vh;
    pointer-events:none;
    opacity:.12;
    border-left:1px solid #4e4a44;
    border-top:1px solid #4e4a44;
    transform:rotate(-4deg);
  }
  main{
    max-width:var(--max);
    min-height:100vh;
    margin:auto;
    padding:0 6vw;
  }
  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:8vh 0 4vh;
    position:relative;
    z-index:1;
  }
  .brand{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(4rem,10vw,8.5rem);
    line-height:.84;
    letter-spacing:-.065em;
    font-weight:400;
    margin:0;
  }
  .submark{
    margin:0 0 1.5rem;
    font-size:.76rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .lower{
    display:grid;
    grid-template-columns:1.45fr .55fr;
    gap:8vw;
    align-items:end;
  }
  .statement{
    max-width:680px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(1.4rem,2.5vw,2.15rem);
    line-height:1.25;
    letter-spacing:-.02em;
  }
  .identity{
    border-top:1px solid var(--ink);
    padding-top:1rem;
    font-size:.82rem;
    color:var(--muted);
  }
  .identity strong{
    display:block;
    color:var(--ink);
    font-size:.95rem;
    font-weight:500;
    margin-bottom:.25rem;
  }
  .contact{
    border-top:1px solid var(--line);
    padding-top:3rem;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4vw;
  }
  .label{
    font-size:.68rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--muted);
  }
  h2{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(2rem,4vw,3.5rem);
    line-height:1.05;
    font-weight:400;
    letter-spacing:-.035em;
    margin:0;
  }
  .contact-info{
    align-self:end;
  }
  .contact-info p{
    margin:.2rem 0;
    color:var(--muted);
  }
  .contact-info a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--accent);
  }
  footer{
    border-top:1px solid var(--line);
    padding-top:1.5rem;
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:.7rem;
    letter-spacing:.05em;
  }
  @media(max-width:720px){
    main{padding:0 7vw}
    .page{padding-top:6vh}
    .lower,.contact{grid-template-columns:1fr;gap:2.5rem}
    .contact{padding-top:2.5rem}
    footer{flex-direction:column;gap:.5rem}
  }
</style>
</head>
<body>
<main>
  <div class="page">

    <header>
      <p class="submark">Advocacia</p>
      <h1 class="brand">GAROFALO</h1>
    </header>

    <div class="lower">
      <div class="statement">
        Advocacia orientada pela responsabilidade profissional,
        pela precisão e pela estratégia.
      </div>

      <div class="identity">
        <strong>Rafael Baida Garofalo</strong>
        Advogado<br>
        OAB/SP 248.991
      </div>
    </div>

    <section class="contact">
      <div>
        <div class="label">Contato</div>
        <h2>Vamos conversar.</h2>
      </div>

      <div class="contact-info">
        <p>São Paulo · Brasil</p>
        <p>
          <a href="mailto:rafael@garofalo.adv.br">
            rafael@garofalo.adv.br
          </a>
        </p>
      </div>
    </section>

    <footer>
      <span>GAROFALO ADVOCACIA</span>
      <span>© 2026 · Conteúdo institucional</span>
    </footer>

  </div>
</main>
</body>
</html>
